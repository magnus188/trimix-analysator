; PlatformIO configuration for ESP32-S3 Trimix Analyzer
; Target: ESP32-8048S043 (4.3" 800x480 IPS Touch Display)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Build flags for ESP32-S3 with PSRAM
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCORE_DEBUG_LEVEL=3
    ; LVGL configuration flags
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_LOG=1
    -DLV_LOG_LEVEL=LV_LOG_LEVEL_INFO
    ; Display configuration for ESP32-8048S043
    -DDISPLAY_WIDTH=800
    -DDISPLAY_HEIGHT=480
    -DTOUCH_ENABLED=1
    ; Sensor configuration 
    -DI2C_SDA=8
    -DI2C_SCL=9
    -DADS1115_ADDR=0x48
    -DBME280_ADDR=0x76

; Library dependencies
lib_deps = 
    ; LVGL graphics library
    lvgl/lvgl@^9.0.0
    ; I2C sensor libraries
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.4
    ; Display driver (adjust based on actual display controller)
    bodmer/TFT_eSPI@^2.5.34
    ; Touch screen library
    PaulStoffregen/XPT2046_Touchscreen@^1.4
    ; WiFi and networking
    arduino-libraries/WiFi@^1.2.7
    ; JSON for settings
    bblanchon/ArduinoJson@^6.21.3
    ; Preferences for settings storage
    arduino-libraries/Preferences

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Partition scheme for larger apps
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

; PSRAM settings for ESP32-S3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB