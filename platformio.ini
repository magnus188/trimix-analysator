; PlatformIO configuration for ESP32-S3 Trimix Analyzer
; Target: ESP32-8048S043 (4.3" 800x480 IPS Touch Display)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Build flags for ESP32-S3 with PSRAM
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCORE_DEBUG_LEVEL=3
    ; Development mode flags
    -DDEVELOPMENT_MODE=1
    -DMOCK_SENSORS_ENABLED=1
    ; LVGL configuration flags
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_USE_LOG=1
    -DLV_LOG_LEVEL=LV_LOG_LEVEL_INFO
    ; Display configuration for ESP32-8048S043
    -DDISPLAY_WIDTH=800
    -DDISPLAY_HEIGHT=480
    -DTOUCH_ENABLED=1
    ; TFT_eSPI configuration for User_Setup.h
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=800
    -DTFT_HEIGHT=480
    -DESP32_PARALLEL=1
    ; Sensor configuration (updated pins to avoid TFT conflicts)
    -DI2C_SDA=19
    -DI2C_SCL=20
    -DADS1115_ADDR=0x48
    -DBME280_ADDR=0x76

; Library dependencies
lib_deps = 
    ; LVGL graphics library
    lvgl/lvgl@^9.2.0
    ; I2C sensor libraries
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; Display driver for ESP32-S3 with RGB displays (stable version)
    bodmer/TFT_eSPI@^2.5.43
    ; JSON for settings
    bblanchon/ArduinoJson@^7.0.4

; Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Partition scheme for larger apps
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

; PSRAM settings for ESP32-S3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB