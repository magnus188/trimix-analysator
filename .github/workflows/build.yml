name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install host test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake pkg-config libsdl2-dev

    - name: Run tests
      run: |
        chmod +x scripts/run_tests.sh
        ./scripts/run_tests.sh

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.1.6
        target: esp32s3
        path: '.'

    - name: Run full host tests
      run: |
        TRIMIX_REQUIRE_SIMULATOR=1 ./scripts/run_tests.sh

    - name: Check firmware size
      run: |
        chmod +x scripts/check_firmware_size.sh
        ./scripts/check_firmware_size.sh

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trimix-analyzer-firmware-${{ github.sha }}
        if-no-files-found: error
        path: |
          build/Trimix_analyzer.bin
          build/Trimix_analyzer.elf
          build/Trimix_analyzer.map
          build/flasher_args.json

    - name: Report build
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ls -lh build/Trimix_analyzer.bin build/Trimix_analyzer.elf build/Trimix_analyzer.map >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Firmware built successfully for ESP32-S3." >> $GITHUB_STEP_SUMMARY
