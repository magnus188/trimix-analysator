name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ESP32 Firmware & Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine version bump type
      id: version-bump
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "bump_type=${{ github.event.inputs.version_bump }}" >> $GITHUB_OUTPUT
          echo "Manual dispatch: Using ${{ github.event.inputs.version_bump }} bump"
          exit 0
        fi
        
        # Default to patch, analyze commits for version bump hints
        BUMP_TYPE="patch"
        
        if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          COMMIT_RANGE="${{ github.event.before }}..${{ github.event.after }}"
          COMMIT_MESSAGES=$(git log --pretty=format:"%s" $COMMIT_RANGE 2>/dev/null || echo "")
        else
          COMMIT_MESSAGES=$(git log --pretty=format:"%s" -10)
        fi
        
        if echo "$COMMIT_MESSAGES" | grep -qiE "BREAKING|^major:|!:"; then
          BUMP_TYPE="major"
        elif echo "$COMMIT_MESSAGES" | grep -qiE "^feat|^feature|^minor:"; then
          BUMP_TYPE="minor"
        fi
        
        echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
        echo "Detected $BUMP_TYPE version bump"

    - name: Calculate new version
      id: version
      run: |
        # Get current version from version.h
        CURRENT=$(grep 'TRIMIX_ANALYZER_VERSION "' main/version.h | sed 's/.*"\(.*\)".*/\1/')
        
        if [ -z "$CURRENT" ]; then
          CURRENT="0.0.0"
        fi
        
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        
        case "${{ steps.version-bump.outputs.bump_type }}" in
          major)
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          minor)
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          patch)
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Version: $CURRENT -> $NEW_VERSION"

    - name: Run tests
      run: |
        chmod +x scripts/run_tests.sh
        ./scripts/run_tests.sh

    - name: Update version.h
      run: |
        NEW_VERSION="${{ steps.version.outputs.new_version }}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$NEW_VERSION"
        GIT_COMMIT=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date -u +"%Y-%m-%d")
        
        cat > main/version.h << EOF
        #pragma once

        // Trimix Analyzer version information
        #define TRIMIX_ANALYZER_VERSION_MAJOR $MAJOR
        #define TRIMIX_ANALYZER_VERSION_MINOR $MINOR
        #define TRIMIX_ANALYZER_VERSION_PATCH $PATCH
        #define TRIMIX_ANALYZER_VERSION "$NEW_VERSION"

        // Build information
        #define BUILD_DATE "$BUILD_DATE"
        #define BUILD_TIME "CI"
        #define GIT_COMMIT "$GIT_COMMIT"

        // GitHub repository information
        #define GITHUB_OWNER "magnus188"
        #define GITHUB_REPO "trimix-analysator"
        #define GITHUB_API_URL "https://api.github.com/repos/" GITHUB_OWNER "/" GITHUB_REPO "/releases/latest"
        #define GITHUB_RELEASES_URL "https://github.com/" GITHUB_OWNER "/" GITHUB_REPO "/releases"

        // Function to get full version string
        const char* get_version_string(void);
        const char* get_build_info(void);
        EOF

    - name: Build with ESP-IDF
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.1.6
        target: esp32s3
        path: '.'

    - name: Rename firmware binary
      run: |
        VERSION="${{ steps.version.outputs.new_version }}"
        cp build/Trimix_analyzer.bin "Trimix_analyzer_v${VERSION}.bin"
        echo "Created Trimix_analyzer_v${VERSION}.bin"
        ls -la *.bin

    - name: Generate changelog
      id: changelog
      run: |
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -n "$LAST_TAG" ]; then
          CHANGES=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --reverse)
        else
          CHANGES=$(git log -10 --pretty=format:"- %s" --reverse)
        fi
        
        {
          echo "changelog<<EOF"
          echo "## Trimix Analyzer v${{ steps.version.outputs.new_version }}"
          echo ""
          echo "### Changes"
          echo "$CHANGES"
          echo ""
          echo "### Installation"
          echo "Download \`Trimix_analyzer_v${{ steps.version.outputs.new_version }}.bin\` and flash via USB or use OTA update from the device."
          echo ""
          echo "Built with ESP-IDF v5.1.6 for ESP32-S3"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.new_version }}
        name: Trimix Analyzer v${{ steps.version.outputs.new_version }}
        body: ${{ steps.changelog.outputs.changelog }}
        files: |
          Trimix_analyzer_v${{ steps.version.outputs.new_version }}.bin
        draft: false
        prerelease: false

    - name: Commit version update
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add main/version.h
        git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
        git push

    - name: Summary
      run: |
        echo "## 🎉 Release Created!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version**: v${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Firmware**: Trimix_analyzer_v${{ steps.version.outputs.new_version }}.bin" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Devices can now update via OTA from Settings > Check for Updates" >> $GITHUB_STEP_SUMMARY
